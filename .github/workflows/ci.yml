name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn build
      - run: yarn test --coverage
  release:
    needs: build
    if: github.repository == 'DylanVann/react-native-fast-image' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn build
      - run: npx --yes -p semantic-release@25 -p @semantic-release/changelog@7 -p @semantic-release/git@11 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
