name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - run: bun run test
  release:
    needs: build
    if: github.repository == 'DylanVann/react-native-fast-image' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One release at a time: a second run waits instead of racing the first to
    # push its release commit.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push the release commit and tag
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch's latest commit, not the one that triggered this run: a
          # run that waited for another release would otherwise be behind that
          # release's commit, and semantic-release skips publishing when the
          # local branch is behind.
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - id: version
        run: echo "before=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: npx --yes -p semantic-release@25 -p @semantic-release/changelog@7 -p @semantic-release/git@11 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # semantic-release only bumps the version (npmPublish: false). Stage the
      # release so it goes live only after a maintainer approves it with 2FA.
      - name: Stage npm release
        run: |
          after=$(node -p 'require("./package.json").version')
          if [ "$after" != "${{ steps.version.outputs.before }}" ]; then
            npx --yes npm@11 stage publish
          else
            echo "No new version; nothing to stage."
          fi
