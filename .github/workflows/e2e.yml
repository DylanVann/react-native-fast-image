name: e2e
# The regression cases (scripts/verify.mts) on the iOS simulator and the
# Android emulator, for each example app. The JS checks are in ci.yml.
# Runs for pull requests (skipping the apps for one that only changes docs),
# and by hand (Actions tab, or `gh workflow run e2e.yml --ref <branch>`): a run
# takes about 10 minutes with its caches. main only takes pull requests rebased
# on it and passing, so it doesn't run again there.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read # when the run started (scripts/group-times.ts)
  pull-requests: read # the files a pull request changes (changes)
env:
  # The minimum example's groups (React Native 0.83, Fast Image's minimum): a
  # smoke test of each area, which the main example's runs cover in full.
  SMOKE_GROUPS: start,load-end,events,errors,layout,auto-size,auto-size-more,auto-size-styles,auto-size-changes,object-fit,downsampling,loading,preload,cache-only,cache-path,write-to-cache,fade,thumbhash,tint,formats,svg,photo-library,configure-cache,non-object-sources
  # Whether this run can save caches and group times to R2 (see "Restore the
  # simulator").
  R2_WRITE: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
  # CI machines are slower than a laptop.
  VERIFY_FLOWS_TIMEOUT: 900
  VERIFY_BUILD_TIMEOUT: 2400
  VERIFY_HELLO_TIMEOUT: 300
# A new push to a pull request (or run by hand) replaces its run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Detects a pull request that only changes docs, so it can skip the e2e
  # tests, which it doesn't need (the e2e job at the end still reports, so it
  # can be merged). And chooses the iOS jobs: the main example's groups in 2 shards
  # (--shard), each a job that builds the app and runs half of them (by their
  # times in recent runs); the minimum example's smoke groups (SMOKE_GROUPS) in
  # one, followed by the Expo example's smoke cases on the web and iOS; and,
  # when a pull request changes the library's iOS or JS code, the
  # regression cases (the tvOS example runs the main example's), the tvOS
  # example, its references, or how the cases run (and in a run by hand), the
  # tvOS example's groups in 2 shards. (At most 5 macOS jobs run at once.)
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
      ios: ${{ steps.matrix.outputs.ios }}
    steps:
      # So that pull requests that don't need the e2e tests skip them: when
      # every file a pull request changes is docs (under docs/ or website/, or
      # a .md file), docs_only is true, and the ios and android jobs don't run.
      # (A run by hand has no pull request, and runs everything.)
      - name: Detect a docs-only pull request
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          docs_only=false
          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            # The files that aren't docs ("|| true": grep fails when there are none).
            not_docs=$(grep -vE '^(docs/|website/)|\.md$' <<< "$files" || true)
            if [ -z "$not_docs" ]; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - name: Choose the iOS jobs
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          jobs='{"app":"main","shard":1},{"app":"main","shard":2},{"app":"minimum","shard":1}'
          if [ -z "$PR" ] || gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' |
            grep -qE '^(ios/|src/|ReactNativeFastImageExample/src/|ReactNativeFastImageExampleTV/|screenshots/tv-ios/|RNFastImage\.podspec$|package\.json$|scripts/verify\.mts$|\.github/workflows/e2e\.yml$)'; then
            jobs="$jobs"',{"app":"tv","shard":1},{"app":"tv","shard":2}'
          fi
          echo "ios={\"include\":[$jobs]}" >> "$GITHUB_OUTPUT"
  ios:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    # Xcode 27 with the iOS 27.0 and tvOS 27.0 simulator runtimes the
    # references were taken on.
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ios) }}
    env:
      APP_DIR: ${{ matrix.app == 'main' && 'ReactNativeFastImageExample' || matrix.app == 'tv' && 'ReactNativeFastImageExampleTV' || 'ReactNativeFastImageExampleMinimum' }}
      # verify.mts's simulator (an Apple TV 4K (3rd generation) for the tvOS
      # example, an iPhone 17 Pro otherwise).
      SIMULATOR: ${{ matrix.app == 'tv' && 'RNFI Apple TV' || 'RNFI iPhone' }}
      SIMULATOR_KEY: ${{ matrix.app == 'tv' && 'tvos-simulator-Apple-TV-4K-3rd-generation-xcode-27.1-v1' || 'ios-simulator-iPhone-17-Pro-xcode-27.1-v3' }}
    steps:
      # Spotlight indexes what the job writes (the checkout, builds,
      # screenshots, recordings): about half a core on average, up to two of
      # the runner's three at times, which stalled the simulator mid-fade.
      - name: Turn off Spotlight
        run: sudo mdutil -a -i off
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Without the other apps' and platforms' reference screenshots (most of
        # the repo's size), the docs, the website and the benchmark: only the
        # files it checks out are downloaded.
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/screenshots/*
            /screenshots/${{ matrix.app }}-ios/
            /screenshots/expo-web/
            /screenshots/expo-ios/
            !/docs/
            !/website/
            !/benchmark/
      # Without the R2 secrets (pull requests from forks), the read-only key.
      - name: Read the read-only R2 key
        if: env.R2_WRITE != 'true'
        run: grep '^R2_READ_' .github/r2-read-only.env >> "$GITHUB_ENV"
      # The Xcode the references were taken with (27.1).
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      # Node, ffmpeg and ffprobe, XCLogParser and simslim
      # (.github/install-tools.sh), downloaded once and kept in R2.
      - name: Restore tools cache
        id: tools
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        # The caches (runs-on/cache, which takes actions/cache's inputs) are
        # in Cloudflare R2, which restores them faster than GitHub's cache and
        # shares them between branches. Pull requests from forks get no
        # secrets: they restore with a read-only key (.github/r2-read-only.env)
        # and don't save (R2_WRITE). Only the cache steps get the R2 keys, not
        # the steps that run the dependencies' code.
        env: &r2
          RUNS_ON_S3_BUCKET_CACHE: react-native-fast-image-ci-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://752eb2e6c01a04c6af29caeb876f4415.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_READ_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_READ_SECRET }}
          AWS_REGION: auto
        with:
          path: ${{ runner.temp }}/tools
          key: tools-macos-${{ hashFiles('.github/install-tools.sh', '.node-version') }}
      # Downloaded only when the cache missed.
      - name: Install tools
        timeout-minutes: 10
        run: |
          if [ "${{ steps.tools.outputs.cache-hit }}" != true ]; then
            .github/install-tools.sh "$RUNNER_TEMP/tools"
          fi
          echo "$RUNNER_TEMP/tools/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      # From one job: they all download the same.
      - name: Save tools cache
        if: env.R2_WRITE == 'true' && steps.tools.outputs.cache-hit != 'true' && matrix.app == 'main' && matrix.shard == 1
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ${{ runner.temp }}/tools
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # idb's companion, for the regression screenshots and video samples
      # (verify.mts's VERIFY_IDB_COMPANION): screenshots in about 100 ms,
      # where simctl's take about 450, with the same pixels. idb 1.7.7 with a
      # fix for Apple TV simulators (.github/idb-companion/README.md).
      - name: Install idb's companion
        run: |
          mkdir -p "$RUNNER_TEMP/idb"
          tar -xzf .github/idb-companion/idb-companion.macos-arm64.tar.gz -C "$RUNNER_TEMP/idb"
          echo "VERIFY_IDB_COMPANION=$RUNNER_TEMP/idb/idb_companion" >> "$GITHUB_ENV"
      - name: "Install the repo's dependencies"
        run: bun install --frozen-lockfile
      # verify.mts's simulator (SIMULATOR), saved by an earlier run after
      # its first boot, slimmed: a new simulator's first boot keeps the
      # runner's 3 cores busy for about 10 minutes, and every boot runs
      # background services (wallpapers, widgets, Siri, Spotlight) for minutes
      # more, while the app builds. CoreSimulator lists the devices in its
      # folder when its service starts. The services simslim turned off are
      # in a file outside the device's folder, read when it boots.
      - name: Restore the simulator
        id: simulator
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ~/simulator-cache
          key: ${{ env.SIMULATOR_KEY }}-${{ hashFiles('.github/simslim.json') }}
      - name: Move the restored simulator into place and boot it
        if: steps.simulator.outputs.cache-hit == 'true'
        run: |
          udid=$(cat ~/simulator-cache/udid)
          mv ~/simulator-cache/"$udid" ~/Library/Developer/CoreSimulator/Devices/
          mkdir -p /private/var/tmp/com.apple.CoreSimulator.SimDevice."$udid"
          cp ~/simulator-cache/disabled.plist /private/var/tmp/com.apple.CoreSimulator.SimDevice."$udid"/
          killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
          xcrun simctl list devices | grep "$SIMULATOR"
          # Booting in the background while the rest restores, so its first
          # minute of background work doesn't slow the build (verify.mts waits
          # for it); and Xcode's device discovery, which xcodebuild otherwise
          # waits for when it starts.
          (xcrun simctl boot "$udid" > /dev/null 2>&1 &)
          (xcrun xcdevice list > /dev/null 2>&1 &)
      # The app's dependencies, Pods, pod install's Codegen output and gems
      # (verify.mts skips pod install while they're current).
      - name: "Restore the app's dependencies and Pods"
        id: deps
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            ${{ env.APP_DIR }}/node_modules
            ${{ env.APP_DIR }}/ios/Pods
            ${{ env.APP_DIR }}/ios/Podfile.lock
            ${{ env.APP_DIR }}/ios/build/generated
            ${{ env.APP_DIR }}/vendor/bundle
          key: ios-deps-v4-${{ matrix.app }}-${{ hashFiles(format('{0}/bun.lock', env.APP_DIR), format('{0}/ios/Podfile', env.APP_DIR), 'package.json', 'RNFastImage.podspec', 'src/specs/**', 'ios/**') }}
          restore-keys: ios-deps-v4-${{ matrix.app }}-
      # React Native's and CocoaPods' downloads, for pod install: only when
      # the dependencies aren't current.
      - name: "Restore React Native's and CocoaPods' downloads"
        id: downloads
        if: steps.deps.outputs.cache-hit != 'true'
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            ~/Library/Caches/ReactNative
            ~/Library/Caches/CocoaPods
          key: ios-downloads-${{ matrix.app }}-${{ hashFiles(format('{0}/bun.lock', env.APP_DIR), format('{0}/ios/Podfile', env.APP_DIR)) }}
          restore-keys: ios-downloads-${{ matrix.app }}-
      # An older key's node_modules is brought up to date (verify.mts only
      # installs when there are none).
      - name: "Update the app's dependencies"
        if: steps.deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
        working-directory: ${{ env.APP_DIR }}
      # Xcode's compilation cache (verify.mts), so builds reuse what earlier
      # runs compiled: the app's newest (each save has its run's key). It's
      # saved again when the build missed it often (see "Check what the run
      # made"): a cache saved once went stale as the build's flags and
      # dependencies changed, and missed every compile.
      - name: "Restore Xcode's compilation cache"
        id: build
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ~/Library/Caches/react-native-fast-image
          key: ios-build-${{ matrix.app }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ios-build-${{ matrix.app }}-
      # maestro-runner's WebDriverAgent build (for the touch group), kept in
      # its package.
      - name: "Restore WebDriverAgent's build"
        id: wda
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: node_modules/@devicelab/maestro-runner-darwin-arm64/cache
          key: ios-wda-${{ hashFiles('bun.lock') }}
      # Metro's transform cache (in TMPDIR), so the first bundle doesn't
      # transform everything again (the Expo example's too, in the minimum
      # example's job).
      - name: "Restore Metro's cache"
        id: metro
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ${{ runner.temp }}/tmp/metro-cache
          key: metro-ios-${{ matrix.app }}-${{ hashFiles(format('{0}/bun.lock', env.APP_DIR), matrix.app == 'minimum' && 'ReactNativeFastImageExampleExpo/bun.lock' || format('{0}/bun.lock', env.APP_DIR)) }}
          restore-keys: metro-ios-${{ matrix.app }}-
      # The groups' times in recent runs, so --shard splits them into halves
      # that take about as long (scripts/group-times.ts).
      - name: "Fetch the groups' times in recent runs"
        run: bun scripts/group-times.ts fetch "$RUNNER_TEMP/group-times.json"
        env: &group-times
          GH_TOKEN: ${{ github.token }}
          RUNS_ON_S3_BUCKET_CACHE: react-native-fast-image-ci-cache
          RUNS_ON_S3_BUCKET_ENDPOINT: https://752eb2e6c01a04c6af29caeb876f4415.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_READ_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_READ_SECRET }}
          AWS_REGION: auto
      # Every 10 s while verify.mts runs: what's using the CPU, and how far the
      # build log has got (verify-output/cpu.log).
      - name: Build the app and run its cases
        id: verify
        run: |
          mkdir -p "$TMPDIR" verify-output
          while sleep 10; do
            echo "== $(date +%T) build log: $(cat verify-output/*/ios-build-*.log 2>/dev/null | wc -l) lines, last: $(tail -qn 1 verify-output/*/ios-build-*.log 2>/dev/null | cut -c1-120)"
            ps -Ao pcpu,comm -r | head -8 | sed -E 's#/[^ ]*/##'
          done > verify-output/cpu.log 2>&1 &
          sampler=$!
          status=0
          node scripts/verify.mts --app ${{ matrix.app }} --ios --no-js ${{ matrix.app == 'minimum' && format('--groups {0}', env.SMOKE_GROUPS) || format('--shard {0}/2', matrix.shard) }} || status=$?
          kill $sampler
          exit $status
        env:
          TMPDIR: ${{ runner.temp }}/tmp
          VERIFY_GROUP_TIMES: ${{ runner.temp }}/group-times.json
      # This job's group times, for later runs' shards.
      - name: "Record the groups' times"
        if: always() && env.R2_WRITE == 'true'
        continue-on-error: true
        run: bun scripts/group-times.ts record ios-${{ matrix.app }}-${{ matrix.shard }}
        env: *group-times
      # The Expo example's web version (verify.mts --app expo --web), in
      # Playwright's Chromium: after the minimum example's groups (this job ends
      # a few minutes before the main example's), and after their times were
      # recorded. Its dependencies and the browser (playwright-core's pinned
      # build, in Playwright's cache) come from R2.
      - name: "Restore the Expo example's dependencies and Playwright's Chromium"
        id: web
        if: ${{ !cancelled() && matrix.app == 'minimum' }}
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            ReactNativeFastImageExampleExpo/node_modules
            ~/Library/Caches/ms-playwright
          key: web-v1-${{ hashFiles('ReactNativeFastImageExampleExpo/bun.lock', 'bun.lock') }}
          restore-keys: web-v1-
      - name: "Update the Expo example's dependencies"
        if: ${{ !cancelled() && matrix.app == 'minimum' && steps.web.outputs.cache-hit != 'true' }}
        run: bun install --frozen-lockfile
        working-directory: ReactNativeFastImageExampleExpo
      - name: "Run the Expo example's web version"
        id: verifyweb
        if: ${{ !cancelled() && matrix.app == 'minimum' }}
        run: node scripts/verify.mts --app expo --web --no-js
        env:
          TMPDIR: ${{ runner.temp }}/tmp
      # The Expo example on iOS (verify.mts --app expo --ios), after its web
      # version: its native project from `expo prebuild` with Fast Image's
      # config plugin, pod install, the build, and its smoke cases. A macOS
      # job of its own would wait when the tvOS jobs run.
      - name: 'Run the Expo example on iOS'
        if: ${{ !cancelled() && matrix.app == 'minimum' }}
        run: node scripts/verify.mts --app expo --ios --no-js
        env:
          TMPDIR: ${{ runner.temp }}/tmp
      - name: "Save the Expo example's dependencies and Playwright's Chromium"
        if: always() && env.R2_WRITE == 'true' && matrix.app == 'minimum' && steps.verifyweb.outcome == 'success' && steps.web.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            ReactNativeFastImageExampleExpo/node_modules
            ~/Library/Caches/ms-playwright
          key: ${{ steps.web.outputs.cache-primary-key }}
      # The simulator verify.mts created, for later runs (see above): without
      # the example apps, with simslim's .github/simslim.json profile (its
      # services stay off on later boots), shut down. From one job, and only
      # after its cases passed (a simulator that broke isn't kept for later
      # runs); not saved if slimming fails.
      - name: Slim the simulator for later runs
        if: env.R2_WRITE == 'true' && steps.simulator.outputs.cache-hit != 'true' && steps.verify.outcome == 'success' && matrix.app != 'minimum' && matrix.shard == 1
        id: savesimulator
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices -j | python3 -c 'import json, sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == sys.argv[1]))' "$SIMULATOR") || exit 0
          for app in ReactNativeFastImageExample ReactNativeFastImageExampleMinimum ReactNativeFastImageExampleTV; do
            xcrun simctl uninstall "$udid" "org.reactjs.native.example.$app" || true
          done
          # Slow runners need longer than simslim's default time limits.
          export SIMSLIM_BOOT_TIMEOUT=20m SIMSLIM_SPAWN_TIMEOUT=5m
          simslim on "$udid" --profile .github/simslim.json
          simslim verify "$udid" --profile .github/simslim.json
          xcrun simctl shutdown "$udid" || true
          mkdir -p ~/simulator-cache
          cp -R ~/Library/Developer/CoreSimulator/Devices/"$udid" ~/simulator-cache/
          cp /private/var/tmp/com.apple.CoreSimulator.SimDevice."$udid"/disabled.plist ~/simulator-cache/
          echo "$udid" > ~/simulator-cache/udid
          echo saved=true >> "$GITHUB_OUTPUT"
      - name: Save the simulator
        if: always() && env.R2_WRITE == 'true' && steps.savesimulator.outputs.saved == 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ~/simulator-cache
          key: ${{ steps.simulator.outputs.cache-primary-key }}
      # Where xcodebuild's time went, from Xcode's activity log (the timing
      # summary leaves out planning): the slowest steps here, the whole report
      # in the run's verify-output.
      - name: "Report where xcodebuild's time went"
        if: always()
        continue-on-error: true
        run: |
          log=$(ls -t "$APP_DIR"/ios/build/Logs/Build/*.xcactivitylog | head -1)
          xclogparser parse --file "$log" --reporter json --output verify-output/xcode-build.json
          python3 - <<'PY'
          import json
          steps = []
          def walk(step, depth):
              steps.append((step.get('duration', 0), depth, step.get('type'), step.get('title', '')))
              for sub in step.get('subSteps', []):
                  walk(sub, depth + 1)
          walk(json.load(open('verify-output/xcode-build.json')), 0)
          print('slowest steps (s, depth, type, title):')
          for duration, depth, kind, title in sorted(steps, reverse=True)[:25]:
              print(f'{duration:8.1f}  {depth}  {kind}  {title[:100]}')
          PY
      # Saved even when cases fail (the builds are still good), but only what
      # the run got as far as making: a run that stopped early would save an
      # empty cache under the key, and later runs would use it.
      - name: Check what the run made
        id: made
        if: always()
        run: |
          test -f "$APP_DIR/ios/Pods/Manifest.lock" && echo deps=true >> "$GITHUB_OUTPUT" || true
          test -d ~/Library/Caches/react-native-fast-image && echo build=true >> "$GITHUB_OUTPUT" || true
          # The compilation cache's misses in this job's builds: a pull
          # request's own changes miss a few dozen (Fast Image has 10 source
          # files), a stale cache hundreds.
          misses=$(cat verify-output/*/ios-build-*.log 2>/dev/null | grep -c '^Cache miss' || true)
          echo "Xcode's compilation cache: $misses misses"
          [ "$misses" -gt 100 ] && echo stale=true >> "$GITHUB_OUTPUT" || true
          test -d "$RUNNER_TEMP/tmp/metro-cache" && echo metro=true >> "$GITHUB_OUTPUT" || true
      - name: "Save the app's dependencies and Pods"
        if: always() && env.R2_WRITE == 'true' && steps.made.outputs.deps == 'true' && steps.deps.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            ${{ env.APP_DIR }}/node_modules
            ${{ env.APP_DIR }}/ios/Pods
            ${{ env.APP_DIR }}/ios/Podfile.lock
            ${{ env.APP_DIR }}/ios/build/generated
            ${{ env.APP_DIR }}/vendor/bundle
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: "Save React Native's and CocoaPods' downloads"
        if: always() && env.R2_WRITE == 'true' && steps.made.outputs.deps == 'true' && steps.downloads.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            ~/Library/Caches/ReactNative
            ~/Library/Caches/CocoaPods
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # From one of the app's jobs: both build the same.
      - name: "Save Xcode's compilation cache"
        if: always() && env.R2_WRITE == 'true' && matrix.shard == 1 && steps.made.outputs.build == 'true' && steps.made.outputs.stale == 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ~/Library/Caches/react-native-fast-image
          key: ${{ steps.build.outputs.cache-primary-key }}
      - name: "Save Metro's cache"
        if: always() && env.R2_WRITE == 'true' && steps.made.outputs.metro == 'true' && steps.metro.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ${{ runner.temp }}/tmp/metro-cache
          key: ${{ steps.metro.outputs.cache-primary-key }}
      - name: "Save WebDriverAgent's build"
        if: always() && env.R2_WRITE == 'true' && steps.wda.outputs.cache-hit != 'true' && hashFiles('node_modules/@devicelab/maestro-runner-darwin-arm64/cache/**') != ''
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: node_modules/@devicelab/maestro-runner-darwin-arm64/cache
          key: ${{ steps.wda.outputs.cache-primary-key }}
      # After a failure, the simulator's logs and the run's crash reports (a
      # simulator stopped once), with the run's output.
      - name: "Collect the simulator's logs and crash reports"
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p verify-output/simulator
          cp -R ~/Library/Logs/CoreSimulator verify-output/simulator/ || true
          cp /private/var/tmp/com.apple.CoreSimulator.SimDevice.*/launchd.log verify-output/simulator/ || true
          find ~/Library/Logs/DiagnosticReports -type f -mmin -60 -exec cp {} verify-output/simulator/ \; || true
      # An upload that fails (it timed out once) doesn't fail the job.
      - name: "Upload the run's output"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-ios-${{ matrix.app }}-${{ matrix.shard }}
          path: verify-output
          retention-days: 14
      # The same without the screenshots, recordings and Xcode's timing
      # report: the results and logs, a small download for reading a failure.
      - name: "Upload the run's results and logs"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-ios-${{ matrix.app }}-${{ matrix.shard }}
          path: |
            verify-output
            !verify-output/**/*.png
            !verify-output/**/*.mp4
            !verify-output/xcode-build.json
          retention-days: 14
  android:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The main example's groups in 2 shards (--shard), each a job that
      # builds the app and runs half of them (by their times in recent runs);
      # the minimum example's smoke groups (SMOKE_GROUPS) in one; and the main
      # example's smoke groups from the package as published (its files),
      # in a Release build (minified with R8, with the package's ProGuard
      # rules); and the Expo example's smoke cases (its native project from
      # `expo prebuild`, with Fast Image's config plugin). These run on Linux,
      # so they don't count towards the 5 macOS jobs that run at once.
      matrix:
        include:
          - { app: main, shard: 1 }
          - { app: main, shard: 2 }
          - { app: minimum, shard: 1 }
          - { app: main, release: true }
          - { app: expo, shard: 1 }
    name: android (${{ matrix.app }}, ${{ matrix.release && 'release' || matrix.shard }})
    env:
      JOB: ${{ matrix.app }}-${{ matrix.release && 'release' || matrix.shard }}
      ANDROID_AVD: rnfi_ci
      # Where avdmanager creates it and the emulator looks for it.
      ANDROID_AVD_HOME: /home/runner/.android/avd
      # No GPU on the runners: software rendering, whose screen recordings
      # have a few frames a second.
      ANDROID_EMULATOR_GPU: swiftshader_indirect
      VERIFY_SPARSE_RECORDINGS: 1
      ANDROID_IMAGE: system-images;android-36;default;x86_64
      APP_DIR: ${{ matrix.app == 'main' && 'ReactNativeFastImageExample' || matrix.app == 'expo' && 'ReactNativeFastImageExampleExpo' || 'ReactNativeFastImageExampleMinimum' }}
    steps:
      # The emulator's data partition needs 7.4 GB, and with the caches
      # restored some runners had only 4.2 GB left: toolchains the runner image
      # has that these jobs don't use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Without the other apps' and platforms' reference screenshots (most of
        # the repo's size), the docs, the website and the benchmark: only the
        # files it checks out are downloaded.
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/screenshots/*
            /screenshots/${{ matrix.app }}-android/
            !/docs/
            !/website/
            !/benchmark/
      # Without the R2 secrets (pull requests from forks), the read-only key.
      - name: Read the read-only R2 key
        if: env.R2_WRITE != 'true'
        run: grep '^R2_READ_' .github/r2-read-only.env >> "$GITHUB_ENV"
      # Node, ffmpeg and ffprobe (.github/install-tools.sh), as in the iOS
      # jobs.
      - name: Restore tools cache
        id: tools
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ${{ runner.temp }}/tools
          key: tools-linux-${{ hashFiles('.github/install-tools.sh', '.node-version') }}
      # Downloaded only when the cache missed.
      - name: Install tools
        timeout-minutes: 10
        run: |
          if [ "${{ steps.tools.outputs.cache-hit }}" != true ]; then
            .github/install-tools.sh "$RUNNER_TEMP/tools"
          fi
          echo "$RUNNER_TEMP/tools/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Save tools cache
        if: env.R2_WRITE == 'true' && steps.tools.outputs.cache-hit != 'true' && matrix.app == 'main' && matrix.shard == 1
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ${{ runner.temp }}/tools
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # Gradle's caches (the dependencies, their transforms, the build cache
      # and Gradle itself), shared by the app's two jobs. In R2 like the
      # others: setup-gradle's, in GitHub's cache, were about 1.4 GB a job and
      # evicted before the next run.
      - name: "Restore Gradle's caches"
        id: gradle
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ matrix.app }}-${{ hashFiles(format('{0}/bun.lock', env.APP_DIR), format('{0}/android/**/*.gradle', env.APP_DIR), format('{0}/android/gradle.properties', env.APP_DIR), format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR)) }}
          restore-keys: android-gradle-${{ matrix.app }}-
      # The NDK and CMake versions the apps build with, which Gradle installs
      # otherwise.
      - name: Restore the NDK and CMake
        id: ndk
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.1.12297006
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-27.1.12297006-cmake-3.22.1
      # ccache's cache for the app's C++ (install-tools.sh): Gradle's build
      # cache doesn't keep C++, about half of the build's task time. The app's
      # newest, for its Debug or Release build (each save has its run's key),
      # saved again when the build missed it often (see "Check what the run
      # made").
      - name: "Restore ccache's cache"
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ~/.cache/ccache
          key: android-ccache-${{ matrix.app }}-${{ matrix.release && 'release' || 'debug' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: android-ccache-${{ matrix.app }}-${{ matrix.release && 'release' || 'debug' }}-
      # The emulator needs KVM.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore the emulator image
        id: image
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: /usr/local/lib/android/sdk/system-images/android-36
          key: android-image-36-x86_64
      # A plain AOSP image, as the references' emulator (a Pixel 7's screen);
      # x86_64 here.
      - name: Install the emulator and create its device
        run: |
          PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install emulator platform-tools "$ANDROID_IMAGE" > /dev/null
          echo no | avdmanager create avd -n "$ANDROID_AVD" -k "$ANDROID_IMAGE" -d pixel_7 -p "$ANDROID_AVD_HOME/$ANDROID_AVD.avd"
          # The index file the emulator finds the AVD by, which avdmanager
          # writes to a home of its own.
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-36\n' "$ANDROID_AVD_HOME/$ANDROID_AVD.avd" > "$ANDROID_AVD_HOME/$ANDROID_AVD.ini"
          printf 'hw.ramSize=6144\nhw.cpu.ncore=4\ndisk.dataPartition.size=6G\n' >> "$ANDROID_AVD_HOME/$ANDROID_AVD.avd/config.ini"
      - name: Save the emulator image
        if: env.R2_WRITE == 'true' && steps.image.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: /usr/local/lib/android/sdk/system-images/android-36
          key: ${{ steps.image.outputs.cache-primary-key }}
      - name: "Install the repo's dependencies"
        run: bun install --frozen-lockfile
      - name: "Restore Metro's cache"
        id: metro
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ${{ runner.temp }}/tmp/metro-cache
          key: metro-android-${{ matrix.app }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: metro-android-${{ matrix.app }}-
      # The groups' times in recent runs, so --shard splits them into halves
      # that take about as long (scripts/group-times.ts).
      - name: "Fetch the groups' times in recent runs"
        run: bun scripts/group-times.ts fetch "$RUNNER_TEMP/group-times.json"
        env: *group-times
      - name: Build the app and run its cases
        run: |
          mkdir -p "$TMPDIR"
          # This job's ccache counts (see "Check what the run made").
          ccache --zero-stats > /dev/null
          case "$APP-$RELEASE" in
            main-true) args="--release --package --groups $SMOKE_GROUPS" ;;
            minimum-*) args="--groups $SMOKE_GROUPS" ;;
            # Its own smoke cases (SmokeExample.tsx).
            expo-*) args= ;;
            *) args="--shard $SHARD/2" ;;
          esac
          node scripts/verify.mts --app "$APP" --android --no-js $args
        env:
          APP: ${{ matrix.app }}
          SHARD: ${{ matrix.shard }}
          RELEASE: ${{ matrix.release }}
          TMPDIR: ${{ runner.temp }}/tmp
          VERIFY_GROUP_TIMES: ${{ runner.temp }}/group-times.json
      # This job's group times, for later runs' shards (not the Release
      # build's, whose groups aren't sharded).
      - name: "Record the groups' times"
        if: always() && env.R2_WRITE == 'true' && !matrix.release
        continue-on-error: true
        run: bun scripts/group-times.ts record android-${{ matrix.app }}-${{ matrix.shard }}
        env: *group-times
      - name: Check what the run made
        id: made
        if: always()
        run: |
          test -d "$RUNNER_TEMP/tmp/metro-cache" && echo metro=true >> "$GITHUB_OUTPUT" || true
          test -d ~/.gradle/caches/modules-2 && echo gradle=true >> "$GITHUB_OUTPUT" || true
          # ccache's hits and misses in this job's build: a pull request's own
          # changes miss a few of the app's files (the library's generated
          # C++), a stale or missing cache every one (16 in the minimum and
          # Expo examples, 59 in the main). Saved when most missed.
          ccache --show-stats || true
          ccache --print-stats 2> /dev/null | awk -F '\t' '
            $1 == "cache_miss" { misses = $2 }
            $1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" { hits += $2 }
            END { exit !(misses > hits) }' && echo ccache=true >> "$GITHUB_OUTPUT" || true
          test -d /usr/local/lib/android/sdk/ndk/27.1.12297006 && test -d /usr/local/lib/android/sdk/cmake/3.22.1 && echo ndk=true >> "$GITHUB_OUTPUT" || true
      # Not the Release build's (the debug jobs' key, and its bundle is
      # transformed for Release).
      - name: "Save Metro's cache"
        if: always() && env.R2_WRITE == 'true' && !matrix.release && steps.made.outputs.metro == 'true' && steps.metro.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ${{ runner.temp }}/tmp/metro-cache
          key: ${{ steps.metro.outputs.cache-primary-key }}
      # From one of the app's jobs: both build the same.
      - name: "Save Gradle's caches"
        if: always() && env.R2_WRITE == 'true' && matrix.shard == 1 && steps.made.outputs.gradle == 'true' && steps.gradle.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle.outputs.cache-primary-key }}
      # From one of the app's jobs: both build the same.
      - name: "Save ccache's cache"
        if: always() && env.R2_WRITE == 'true' && (matrix.shard == 1 || matrix.release) && steps.made.outputs.ccache == 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: ~/.cache/ccache
          key: android-ccache-${{ matrix.app }}-${{ matrix.release && 'release' || 'debug' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save the NDK and CMake
        if: always() && env.R2_WRITE == 'true' && matrix.app == 'main' && matrix.shard == 1 && steps.made.outputs.ndk == 'true' && steps.ndk.outputs.cache-hit != 'true'
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env: *r2
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.1.12297006
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ${{ steps.ndk.outputs.cache-primary-key }}
      # An upload that fails (it timed out once) doesn't fail the job.
      - name: "Upload the run's output"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-android-${{ env.JOB }}
          path: verify-output
          retention-days: 14
      # The same without the screenshots, recordings and Xcode's timing
      # report: the results and logs, a small download for reading a failure.
      - name: "Upload the run's results and logs"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-android-${{ env.JOB }}
          path: |
            verify-output
            !verify-output/**/*.png
            !verify-output/**/*.mp4
            !verify-output/xcode-build.json
          retention-days: 14
  # The one check main's ruleset requires (the ios and android jobs' names
  # change with their matrices, so the ruleset can't list them). Passes when
  # every job passed, or for a docs-only pull request, whose ios and android
  # jobs were skipped. It runs even when the run is cancelled, and fails then:
  # skipped, it would count as passing.
  e2e:
    needs: [changes, ios, android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          echo "changes: $CHANGES, docs only: $DOCS_ONLY, ios: $IOS, android: $ANDROID"
          if [ "$CHANGES" != success ]; then
            exit 1
          fi
          if [ "$DOCS_ONLY" = true ]; then
            exit 0
          fi
          [ "$IOS" = success ] && [ "$ANDROID" = success ]
