def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    // The Android Gradle plugin is only required when opening the android folder stand-alone.
    // This avoids unnecessary downloads and potential conflicts when the library is included as a
    // module dependency in an application project.
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:8.7.3'
        }
    }
}

apply plugin: 'com.android.library'
// Runs Codegen for the specs in src/ (the view's props and events, and the
// module).
apply plugin: 'com.facebook.react'

android {
    namespace "com.dylanvann.fastimage"
    compileSdkVersion safeExtGet('compileSdkVersion', 35)
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
    }
    sourceSets {
        main {
            java {
                if (safeExtGet('excludeAppGlideModule', false)) {
                    srcDir "src"
                    exclude "**/FastImageGlideModule.java"
                }
            }
        }
    }
    lint {
        abortOnError false
    }
}

react {
    jsRootDir = file("../src/")
    libraryName = "RNFastImageSpec"
    codegenJavaPackageName = "com.dylanvann.fastimage"
}

repositories {
    google()
    mavenCentral()
}

def glideVersion = safeExtGet('glideVersion', '4.16.0')

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation "com.github.bumptech.glide:glide:${glideVersion}"
    // FastImageGlideModule and FastImageOkHttpProgressGlideModule use @GlideModule.
    implementation "com.github.bumptech.glide:annotations:${glideVersion}"
    implementation "com.github.bumptech.glide:okhttp3-integration:${glideVersion}"
    annotationProcessor "com.github.bumptech.glide:compiler:${glideVersion}"
}
