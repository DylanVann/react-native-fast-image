def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    // The Android Gradle plugin is only required when opening the android folder stand-alone.
    // This avoids unnecessary downloads and potential conflicts when the library is included as a
    // module dependency in an application project.
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:8.7.3'
        }
    }
}

apply plugin: 'com.android.library'
// Codegen for the component and module specs (src/specs), from the app's
// React Native Gradle plugin.
apply plugin: 'com.facebook.react'

android {
    namespace "com.dylanvann.fastimage"
    // React Native 0.76's.
    compileSdkVersion safeExtGet('compileSdkVersion', 35)
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
        // Applied to the app's release build, so apps don't need to add them.
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets {
        main {
            java {
                if (safeExtGet('excludeAppGlideModule', false)) {
                    srcDir "src"
                    exclude "**/FastImageGlideModule.java"
                }
            }
        }
    }
    lint {
        abortOnError false
    }
}

react {
    jsRootDir = file("../src/specs")
    libraryName = "RNFastImageSpec"
    codegenJavaPackageName = "com.dylanvann.fastimage"
}

repositories {
    google()
    mavenCentral()
}

// When changing the default, revisit the Glide rules in consumer-rules.pro.
// 5.0.7: Glide 5.0.9 needs apps to compile against API 37 (React Native 0.76's
// compileSdk is 35).
def glideVersion = safeExtGet('glideVersion', '5.0.7')

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation "com.github.bumptech.glide:glide:${glideVersion}"
    // FastImageGlideModule and FastImageOkHttpProgressGlideModule use @GlideModule.
    implementation "com.github.bumptech.glide:annotations:${glideVersion}"
    implementation "com.github.bumptech.glide:okhttp3-integration:${glideVersion}"
    annotationProcessor "com.github.bumptech.glide:compiler:${glideVersion}"
    // SVG images, when the app has AndroidSVG (either package): not shipped,
    // so there's never a second copy of it (see FastImageSvg).
    compileOnly 'com.caverock:androidsvg-aar:1.4'
}
