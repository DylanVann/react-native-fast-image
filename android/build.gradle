def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def agpVersionMajor() {
    try {
        return com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
    } catch (Exception ignored) {
        return 7
    }
}

buildscript {
    // The Android Gradle plugin is only required when opening the android folder stand-alone.
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath("com.android.tools.build:gradle:8.7.3")
        }
    }
}

apply plugin: "com.android.library"

android {
    if (agpVersionMajor() >= 7) {
        namespace "com.dylanvann.fastimage"
    }

    compileSdkVersion safeExtGet("compileSdkVersion", 34)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 16)
        targetSdkVersion safeExtGet("targetSdkVersion", 34)
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            java {
                if (safeExtGet('excludeAppGlideModule', false)) {
                    srcDir "src"
                    exclude "**/FastImageGlideModule.java"
                }
            }
        }
    }

    if (agpVersionMajor() >= 7) {
        lint {
            abortOnError false
        }
    } else {
        lintOptions {
            abortOnError false
        }
    }
}

repositories {
    mavenCentral()
    google()
    maven {
        url "$rootDir/../node_modules/react-native/android"
    }
    maven {
        url "$rootDir/../node_modules/jsc-android/dist"
    }
}

def glideVersion = safeExtGet('glideVersion', '4.16.0')

dependencies {
    //noinspection GradleDynamicVersion
    implementation("com.facebook.react:react-native:+")
    implementation("com.github.bumptech.glide:glide:${glideVersion}")
    implementation("com.github.bumptech.glide:okhttp3-integration:${glideVersion}")
    annotationProcessor("com.github.bumptech.glide:compiler:${glideVersion}")
}
