# Opens the Regression tab and waits for every case to report OK. A crash or a
# missing event fails the flow. Each case is scrolled into view first (a no-op
# when it's already visible; on the legacy architecture, iOS reports off-screen
# rows as visible, so the waits pass without scrolling there).
#
#   bunx maestro-runner --platform ios|android test -e APP_ID=<app id> maestro/regression.yaml
#
# App IDs are listed in walkthrough.yaml.
appId: ${APP_ID}
# maestro-runner saves each screenshot in the run's report and also here,
# relative to this file (ignored).
env:
    OUT: maestro-screenshots
---
- launchApp:
      stopApp: true
# The first launch after an install can be slow on Android (the app is still
# being compiled), so wait for the tab bar rather than tapping right away.
- extendedWaitUntil:
      visible:
          id: 'tab-regression'
      timeout: 60000
- tapOn:
      id: 'tab-regression'
- scrollUntilVisible:
      element: 'tint-remote: .*'
      timeout: 10000
- extendedWaitUntil:
      visible: 'tint-remote: OK'
      timeout: 30000
- scrollUntilVisible:
      element: 'tint-404: .*'
      timeout: 10000
- extendedWaitUntil:
      visible: 'tint-404: OK'
      timeout: 30000
- scrollUntilVisible:
      element: 'remove-onLoad: .*'
      timeout: 10000
- extendedWaitUntil:
      visible: 'remove-onLoad: OK'
      timeout: 30000
- scrollUntilVisible:
      element: 'remove-onLoadEnd: .*'
      timeout: 10000
- extendedWaitUntil:
      visible: 'remove-onLoadEnd: OK'
      timeout: 30000
- scrollUntilVisible:
      element: 'remove-onError: .*'
      timeout: 10000
- extendedWaitUntil:
      visible: 'remove-onError: OK'
      timeout: 30000
- takeScreenshot: ${OUT}/regression-top
- scrollUntilVisible:
      element: 'default-no-source: .*'
      timeout: 10000
- extendedWaitUntil:
      visible: 'default-no-source: OK'
      timeout: 30000
- scrollUntilVisible:
      element: 'preload-no-uri: .*'
      timeout: 10000
- extendedWaitUntil:
