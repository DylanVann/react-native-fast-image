# Taps the regression runner's `touch` cases, which need a real touch: the
# touchable, pointer-events, accessibility-label, aria-label and hitSlop images,
# and on Android moves keyboard focus through the focus case's image.
# scripts/verify.mts runs it while the runner shows that group, and the cases
# report their OK to the runner (see
# ReactNativeFastImageExample/src/RegressionRunner.tsx). A crash fails the
# group. By hand, with the runner showing the group (or the Regression tab
# scrolled to it):
#
#   bunx maestro-runner --platform ios|android test -e APP_ID=<app id> maestro/touch.yaml
#
# App IDs:
#   ReactNativeFastImageExample        iOS: org.reactjs.native.example.ReactNativeFastImageExample
#                                      Android: com.reactnativefastimageexample
#   ReactNativeFastImageExampleMinimum iOS: org.reactjs.native.example.ReactNativeFastImageExampleMinimum
#                                      Android: com.reactnativefastimageexampleminimum
#
# Elements are selected by testID: on iOS, maestro-runner resolves those with
# a WebDriverAgent lookup.
appId: ${APP_ID}
# Not one of the flows verify.mts runs after the runner (it excludes `runner`).
tags:
    - runner
---
- tapOn:
      id: 'regression-touchable-image'
- tapOn:
      id: 'regression-pointer-events-target'
- tapOn:
      id: 'regression-box-none-target'
# By its accessibility label.
- tapOn:
      text: 'regression accessible image'
# By its aria-label.
- tapOn:
      text: 'regression aria-label image'
# Beside the image, inside its hitSlop.
- tapOn:
      id: 'regression-hit-slop-target'
# Android: focus the text field before the focus case's image, then Tab to the
# image (onFocus) and on (onBlur).
- runFlow:
      when:
          platform: Android
      commands:
          - tapOn:
                id: 'regression-focus-input'
          - pressKey: Tab
          - pressKey: Tab
