# Walks through every example screen, checks that images load and events fire,
# and saves screenshots for review.
#
#   maestro test -e APP_ID=<app id> maestro/walkthrough.yaml
#
# App IDs:
#   ReactNativeFastImageExample        iOS: org.reactjs.native.example.ReactNativeFastImageExample
#                                      Android: com.reactnativefastimageexample
#   ReactNativeFastImageExampleLegacy  iOS: org.reactjs.native.example.ReactNativeFastImageExampleLegacy
#                                      Android: com.reactnativefastimageexamplelegacy
appId: ${APP_ID}
env:
    OUT: maestro-screenshots
---
- launchApp:
      stopApp: true
- extendedWaitUntil:
      visible: '.*Prioritize images.*'
      timeout: 30000
- takeScreenshot: ${OUT}/01-top

# Progress callbacks fire (onLoadStart, onProgress, onLoad). iOS exposes the
# three lines as one element, so match within a longer text.
- scrollUntilVisible:
      element: '.*onLoad - [0-9]+ ms.*'
      direction: DOWN
      timeout: 60000
      speed: 30
      visibilityPercentage: 50
      centerElement: true
- assertVisible: '.*onLoadStart - [0-9]+ ms.*'
- assertVisible: '.*onProgress - 100 %.*'

- launchApp:
      stopApp: true
- extendedWaitUntil:
      visible: '.*Prioritize images.*'
      timeout: 30000
- scroll
- takeScreenshot: ${OUT}/02
- scroll
- takeScreenshot: ${OUT}/03
- scroll
- takeScreenshot: ${OUT}/04
- scroll
- takeScreenshot: ${OUT}/05
- scroll
- takeScreenshot: ${OUT}/06
- scroll
- takeScreenshot: ${OUT}/07-bottom

# Preload an image, then show it.
- launchApp:
      stopApp: true
- extendedWaitUntil:
      visible: '.*Prioritize images.*'
      timeout: 30000
- scrollUntilVisible:
      element: 'Preload'
      direction: DOWN
- tapOn: 'Preload'
- tapOn: 'Show'
- waitForAnimationToEnd:
      timeout: 8000
- takeScreenshot: ${OUT}/08-preload

- tapOn:
      id: 'tab-image-grid'
- extendedWaitUntil:
      notVisible: '.*Error fetching images.*'
      timeout: 5000
- waitForAnimationToEnd:
      timeout: 15000
- takeScreenshot: ${OUT}/09-image-grid
- tapOn:
      id: 'tab-fastimage-grid'
- extendedWaitUntil:
      notVisible: '.*Error fetching images.*'
      timeout: 5000
- waitForAnimationToEnd:
      timeout: 15000
- takeScreenshot: ${OUT}/10-fastimage-grid
