# Walks through every example screen, checks that images load and events fire,
# and saves screenshots for review. Preloading is checked in regression.yaml.
#
#   npx maestro-runner --platform ios|android test -e APP_ID=<app id> maestro/walkthrough.yaml
#
# App IDs:
#   ReactNativeFastImageExample        iOS: org.reactjs.native.example.ReactNativeFastImageExample
#                                      Android: com.reactnativefastimageexample
#   ReactNativeFastImageExampleLegacy  iOS: org.reactjs.native.example.ReactNativeFastImageExampleLegacy
#                                      Android: com.reactnativefastimageexamplelegacy
appId: ${APP_ID}
# maestro-runner saves each screenshot in the run's report and also here,
# relative to this file (ignored).
env:
    OUT: maestro-screenshots
---
- launchApp:
      stopApp: true
- extendedWaitUntil:
      visible: '.*Prioritize images.*'
      timeout: 30000
- takeScreenshot: ${OUT}/01-top

# Progress callbacks fire (onLoadStart, onProgress, onLoad). Scroll to the
# section's heading (always there), then wait for the events: they only appear
# once the image loads, which can take a while on the emulator. iOS exposes the
# three lines as one element, so match within a longer text ((?s): any line breaks).
- scrollUntilVisible:
      element: '.*Progress callbacks.*'
      direction: DOWN
      timeout: 60000
      speed: 30
      centerElement: true
- extendedWaitUntil:
      visible: '(?s).*onLoad - [0-9]+ ms.*'
      timeout: 30000
- assertVisible: '(?s).*onLoadStart - [0-9]+ ms.*'
- assertVisible: '(?s).*onProgress - 100 %.*'

- launchApp:
      stopApp: true
- extendedWaitUntil:
      visible: '.*Prioritize images.*'
      timeout: 30000
- scroll
- takeScreenshot: ${OUT}/02
- scroll
- takeScreenshot: ${OUT}/03
- scroll
- takeScreenshot: ${OUT}/04
- scroll
- takeScreenshot: ${OUT}/05
- scroll
- takeScreenshot: ${OUT}/06
- scroll
- takeScreenshot: ${OUT}/07-bottom

- tapOn:
      id: 'tab-image-grid'
# The first image's test ID changes once it loads (see ImageGrid.tsx).
- extendedWaitUntil:
      visible:
          id: 'image-grid-0-loaded'
      timeout: 30000
- takeScreenshot: ${OUT}/09-image-grid
- tapOn:
      id: 'tab-fastimage-grid'
# The first image's test ID changes once it loads (see ImageGrid.tsx).
- extendedWaitUntil:
      visible:
          id: 'fastimage-grid-0-loaded'
      timeout: 30000
- takeScreenshot: ${OUT}/10-fastimage-grid
