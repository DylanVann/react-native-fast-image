<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Regression screenshots</title>
        <style>
            :root {
                --bg: #fff;
                --fg: #1d1d1f;
                --muted: #6e6e73;
                --line: #e2e2e6;
                --panel: #f6f6f8;
                --accent: #0a66d8;
                --failed: #c4291c;
                --new: #8a4fd6;
                --differs: #d97a00;
                --approved: #1f8a4c;
                --ok: #9a9aa0;
                --area: rgba(10, 102, 216, 0.9);
                color-scheme: light dark;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #161618;
                    --fg: #ececf0;
                    --muted: #9a9aa3;
                    --line: #2c2c31;
                    --panel: #1f1f23;
                    --accent: #5aa2ff;
                    --area: rgba(90, 162, 255, 0.95);
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                font:
                    14px/1.45 -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                display: grid;
                grid-template-columns: 260px 1fr;
                grid-template-rows: auto 1fr;
                height: 100vh;
            }
            header {
                grid-column: 1 / -1;
                display: flex;
                gap: 12px;
                align-items: center;
                padding: 10px 16px;
                border-bottom: 1px solid var(--line);
            }
            header h1 {
                font-size: 15px;
                margin: 0;
            }
            header .run {
                color: var(--muted);
                font-family: ui-monospace, monospace;
                font-size: 12px;
            }
            header .spacer {
                flex: 1;
            }
            button,
            select {
                font: inherit;
                padding: 4px 10px;
                border-radius: 6px;
                border: 1px solid var(--line);
                background: var(--panel);
                color: var(--fg);
                cursor: pointer;
            }
            button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            button:disabled {
                opacity: 0.5;
                cursor: default;
            }
            nav {
                overflow: auto;
                border-right: 1px solid var(--line);
                padding: 8px 0;
            }
            nav h2 {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--muted);
                margin: 12px 16px 4px;
            }
            nav a {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 3px 16px;
                color: inherit;
                text-decoration: none;
                font-family: ui-monospace, monospace;
                font-size: 12.5px;
            }
            nav a.selected {
                background: var(--panel);
                font-weight: 600;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                flex: none;
            }
            .state-failed {
                --state: var(--failed);
            }
            .state-new {
                --state: var(--new);
            }
            .state-differs {
                --state: var(--differs);
            }
            .state-removed {
                --state: var(--differs);
            }
            .state-ok {
                --state: var(--ok);
            }
            .dot,
            .badge {
                background: var(--state);
            }
            .badge {
                color: #fff;
                border-radius: 4px;
                padding: 1px 6px;
                font-size: 12px;
                font-weight: 600;
            }
            main {
                overflow: auto;
                padding: 16px 20px 40px;
            }
            .title {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .title h2 {
                margin: 0;
                font-size: 18px;
                font-family: ui-monospace, monospace;
            }
            .error {
                color: var(--failed);
                font-size: 13px;
            }
            .detail {
                color: var(--muted);
                margin: 4px 0 0;
                font-size: 13px;
            }
            .description {
                margin: 12px 0;
                max-width: 900px;
            }
            .description p {
                margin: 4px 0;
            }
            .description b {
                display: inline-block;
                min-width: 54px;
                color: var(--muted);
                font-weight: 600;
            }
            .layout {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 380px;
                gap: 20px;
                align-items: start;
            }
            .images {
                display: grid;
                grid-auto-flow: column;
                grid-auto-columns: minmax(0, 1fr);
                gap: 12px;
            }
            figure {
                margin: 0;
            }
            figcaption {
                font-size: 12px;
                color: var(--muted);
                margin-bottom: 4px;
            }
            /* The screenshots fit their column and the window's height; the
            overlays are placed over the image's box (see place). */
            .frame {
                position: relative;
            }
            .frame > img {
                display: block;
                max-width: 100%;
                max-height: calc(100vh - 120px);
                border: 1px solid var(--line);
            }
            .frame svg,
            .slider .top {
                position: absolute;
                pointer-events: none;
            }
            .slider .top {
                overflow: hidden;
            }
            .slider .top img {
                display: block;
                width: 100%;
                height: 100%;
            }
            .frame .missing {
                height: 240px;
                display: grid;
                place-items: center;
                color: var(--muted);
                font-size: 13px;
                border: 1px dashed var(--line);
            }
            .slider input {
                width: 100%;
                margin-top: 6px;
            }
            .cases {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .case {
                padding: 8px 10px;
                border-radius: 8px;
                border: 1px solid transparent;
            }
            .case:hover,
            .case.hovered {
                border-color: var(--line);
                background: var(--panel);
            }
            .case .head {
                display: flex;
                gap: 8px;
                align-items: baseline;
            }
            .case .n {
                font-size: 11px;
                font-weight: 700;
                color: #fff;
                background: var(--area);
                border-radius: 4px;
                padding: 0 5px;
            }
            .case .id {
                font-family: ui-monospace, monospace;
                font-weight: 600;
            }
            .case .status {
                color: var(--failed);
                font-size: 13px;
            }
            .case p {
                margin: 3px 0 0;
            }
            .case .label {
                color: var(--muted);
                font-weight: 600;
            }
            .layout.by-case {
                grid-template-columns: 220px minmax(0, 1fr);
            }
            .layout.by-case .images {
                position: sticky;
                top: 0;
            }
            .crops {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
                margin-top: 6px;
            }
            .crops img,
            figure > canvas {
                display: block;
                max-width: 100%;
                max-height: 60vh;
                border: 1px solid var(--line);
                background: #fff;
            }
            .case .badge {
                margin-left: 4px;
            }
            .case .head button {
                margin-left: auto;
                padding: 1px 8px;
            }
            .samples {
                margin-top: 16px;
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
            }
            .samples video {
                height: 360px;
                border: 1px solid var(--line);
            }
            .empty {
                color: var(--muted);
                padding: 40px;
            }
            kbd {
                font:
                    11px ui-monospace,
                    monospace;
                border: 1px solid var(--line);
                border-radius: 4px;
                padding: 0 4px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Regression screenshots</h1>
            <span class="run" id="run"></span>
            <span class="error" id="error"></span>
            <span class="spacer"></span>
            <select id="filter">
                <option value="review">To review</option>
                <option value="all">All tests</option>
            </select>
            <select id="mode">
                <option value="side">Side by side</option>
                <option value="slider">Slider</option>
            </select>
            <button id="approve-all">Approve all to review</button>
            <span class="detail"
                ><kbd>j</kbd>/<kbd>k</kbd> next/previous, <kbd>a</kbd> approve,
                <kbd>u</kbd> undo</span
            >
        </header>
        <nav id="nav"></nav>
        <main id="main"><p class="empty">Loading…</p></main>
        <script>
            const TO_REVIEW = ['failed', 'new', 'differs', 'removed']
            let data = { entries: [] }
            let selected
            let hovered
            const $ = (id) => document.getElementById(id)
            // Changes with each load, so an approved reference isn't the
            // browser's cached image.
            let version = 0
            const file = (p) =>
                `/file?path=${encodeURIComponent(p)}&v=${version}`
            // A committed reference (git's HEAD), by its path in the
            // repository.
            const committedFile = (reference) =>
                `/committed?path=${encodeURIComponent(reference)}&v=${version}`
            const esc = (s) =>
                String(s ?? '').replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            '&': '&amp;',
                            '<': '&lt;',
                            '>': '&gt;',
                            '"': '&quot;',
                        })[c],
                )
            const groupId = (g) => `${g.key}/${g.name}`

            function shownGroups() {
                const all = data.entries.flatMap((e) => e.groups)
                return $('filter').value === 'all'
                    ? all
                    : all.filter(
                          (g) =>
                              TO_REVIEW.includes(g.state) ||
                              groupId(g) === selected,
                      )
            }

            async function refresh() {
                data = await (await fetch('/api/runs')).json()
                version++
                $('run').textContent = data.run
                    ? `committed references, and changes from the run in ${data.run} or not committed`
                    : 'committed references, and changes not committed'
                // Every group, when the first load has none to review.
                if (
                    version === 1 &&
                    !data.entries.some((e) =>
                        e.groups.some((g) => TO_REVIEW.includes(g.state)),
                    )
                )
                    $('filter').value = 'all'
                const groups = shownGroups()
                if (!groups.some((g) => groupId(g) === selected))
                    selected = groups[0] && groupId(groups[0])
                render()
            }

            function render() {
                const groups = shownGroups()
                const review = toApprove()
                $('approve-all').disabled = review.length === 0
                $('approve-all').textContent =
                    `Approve all to review (${review.length})`
                $('nav').innerHTML = data.entries
                    .map((entry) => {
                        const items = entry.groups.filter((g) =>
                            groups.includes(g),
                        )
                        if (items.length === 0) return ''
                        return (
                            `<h2>${esc(entry.key)}</h2>` +
                            items
                                .map(
                                    (g) =>
                                        `<a href="#" data-id="${esc(groupId(g))}" class="state-${g.state}${groupId(g) === selected ? ' selected' : ''}" title="${g.state === 'ok' ? '' : g.state}"><span class="dot"></span>${esc(g.name)}</a>`,
                                )
                                .join('')
                        )
                    })
                    .join('')
                if (!groups.length) {
                    $('nav').innerHTML =
                        '<p class="empty">Nothing to review.</p>'
                }
                renderGroup(
                    data.entries
                        .flatMap((e) => e.groups)
                        .find((g) => groupId(g) === selected),
                )
            }

            function descriptionHtml(d) {
                if (!d) return '<p class="detail">No description.</p>'
                return (
                    `<p><b>Checks</b> ${esc(d.checks)}</p>` +
                    (d.steps ? `<p><b>Steps</b> ${esc(d.steps)}</p>` : '') +
                    (d.shows ? `<p><b>Shows</b> ${esc(d.shows)}</p>` : '')
                )
            }

            // An image (its url) with the cases' areas drawn over it.
            function frame(src, label) {
                if (!src)
                    return `<figure><figcaption>${label}</figcaption><div class="frame"><div class="missing">none</div></div></figure>`
                return `<figure><figcaption>${label}</figcaption><div class="frame"><img src="${src}" onload="overlay(this)" /><svg data-areas preserveAspectRatio="none"></svg></div></figure>`
            }

            // An image (its url) on its own.
            const crop = (src, label) =>
                `<figure><figcaption>${label}</figcaption>${src ? `<img src="${src}" />` : '<div class="missing">none</div>'}</figure>`

            // An image's pictures, in figures (frame or crop): its committed
            // reference, its uncommitted image and their diff (odiff's from
            // the run, or drawn here), or the reference alone if nothing
            // differs.
            function pictures(image, figure) {
                const committed = image.committed
                    ? committedFile(image.reference)
                    : undefined
                if (image.state === 'ok')
                    return figure(
                        image.current ? file(image.current) : committed,
                        'Reference',
                    )
                const current = image.current ? file(image.current) : undefined
                return (
                    figure(committed, 'Committed') +
                    figure(
                        current,
                        image.approved ? 'Not committed' : 'This run',
                    ) +
                    (image.diff
                        ? figure(file(image.diff), 'Diff')
                        : committed && current
                          ? `<figure><figcaption>Diff</figcaption><canvas data-a="${committed}" data-b="${current}"></canvas></figure>`
                          : '')
                )
            }

            // Draws the diffs the run has none for: the committed image faded,
            // and the pixels that differ in red.
            function drawDiffs() {
                document
                    .querySelectorAll('canvas[data-a]')
                    .forEach(async (canvas) => {
                        const load = (src) =>
                            new Promise((resolve, reject) => {
                                const img = new Image()
                                img.onload = () => resolve(img)
                                img.onerror = reject
                                img.src = src
                            })
                        const [a, b] = await Promise.all([
                            load(canvas.dataset.a),
                            load(canvas.dataset.b),
                        ])
                        if (a.width !== b.width || a.height !== b.height) {
                            canvas.replaceWith(
                                Object.assign(document.createElement('p'), {
                                    className: 'detail',
                                    textContent: `Sizes differ: ${a.width}×${a.height} committed, ${b.width}×${b.height} now.`,
                                }),
                            )
                            return
                        }
                        canvas.width = a.width
                        canvas.height = a.height
                        const context = canvas.getContext('2d')
                        const pixels = (img) => {
                            context.drawImage(img, 0, 0)
                            return context.getImageData(0, 0, a.width, a.height)
                        }
                        const before = pixels(a)
                        const after = pixels(b)
                        const out = context.createImageData(a.width, a.height)
                        for (let i = 0; i < out.data.length; i += 4) {
                            const differs = [0, 1, 2, 3].some(
                                (c) => before.data[i + c] !== after.data[i + c],
                            )
                            const gray =
                                (before.data[i] +
                                    before.data[i + 1] +
                                    before.data[i + 2]) /
                                3
                            out.data.set(
                                differs
                                    ? [230, 0, 0, 255]
                                    : [gray, gray, gray, 60],
                                i,
                            )
                        }
                        context.putImageData(out, 0, 0)
                    })
            }

            // Draws the case areas once the image's size is known.
            function overlay(img) {
                const svg = img.parentElement.querySelector('svg[data-areas]')
                if (!svg) return
                svg.setAttribute(
                    'viewBox',
                    `0 0 ${img.naturalWidth} ${img.naturalHeight}`,
                )
                place(img)
                drawAreas()
            }

            // Puts a frame's overlays (the areas, the slider's top image)
            // over its image's box.
            function place(img) {
                const box = {
                    left: `${img.offsetLeft}px`,
                    top: `${img.offsetTop}px`,
                    width: `${img.offsetWidth}px`,
                    height: `${img.offsetHeight}px`,
                }
                img.parentElement
                    .querySelectorAll(':scope > svg, :scope > .top')
                    .forEach((el) => Object.assign(el.style, box))
            }
            window.addEventListener('resize', () =>
                document.querySelectorAll('.frame > img').forEach(place),
            )

            function drawAreas() {
                const group = current()
                if (!group) return
                document.querySelectorAll('svg[data-areas]').forEach((svg) => {
                    svg.innerHTML = group.cases
                        .map((c, i) => {
                            const a = c.area
                            if (!a) return ''
                            const on = hovered === c.id
                            return `<rect x="${a.x}" y="${a.y}" width="${a.width}" height="${a.height}" fill="${on ? 'rgba(10,102,216,0.12)' : 'none'}" stroke="var(--area)" stroke-width="${on ? 6 : 2}" stroke-dasharray="${on ? '' : '10 8'}" rx="8"/><text x="${a.x + 10}" y="${a.y + 34}" font-size="30" font-weight="700" fill="var(--area)">${i + 1}</text>`
                        })
                        .join('')
                })
            }

            const current = () =>
                data.entries
                    .flatMap((e) => e.groups)
                    .find((g) => groupId(g) === selected)

            // A case's description, as in the case list.
            function caseDescription(c) {
                if (!c.description) return ''
                return (
                    `<p>${esc(c.description.checks)}</p>` +
                    (c.description.steps
                        ? `<p><span class="label">Steps:</span> ${esc(c.description.steps)}</p>`
                        : '') +
                    `<p><span class="label">Shows:</span> ${esc(c.description.shows)}</p>`
                )
            }

            // A state's badge (none when nothing differs).
            const badge = (state, className = '') =>
                state === 'ok'
                    ? ''
                    : `<span class="badge ${className}">${state}</span>`
            // An image's change: from the run, to approve, or approved (in
            // screenshots/) and not committed, to undo.
            const pending = (image) =>
                !!image && !image.approved && !!image.current
            const change = (image) =>
                !image || image.state === 'ok'
                    ? ''
                    : `<span class="detail">${image.approved ? 'not committed' : 'not approved'}</span>`
            // A group's images.
            const images = (g) =>
                [g.whole, ...g.cases.map((c) => c.image)].filter(Boolean)
            // A case's status, unless it passed (or the run didn't have it).
            const status = (c) =>
                c.status && c.status !== 'OK'
                    ? `<span class="status">${esc(c.status)}</span>`
                    : ''

            // A case: its description, then its pictures. approvable: its
            // group's.
            function caseRow(c, i, approvable) {
                const image = c.image
                return `<div class="case" data-case="${esc(c.id)}">
                    <div class="head"><span class="n">${i + 1}</span><span class="id">${esc(c.id)}</span>${image ? badge(image.state, `state-${image.state}`) : ''}${change(image)}${status(c)}${approvable && pending(image) ? `<button data-approve="${esc(c.id)}">Approve</button>` : ''}${image?.approved ? `<button data-undo="${esc(c.id)}">Undo</button>` : ''}</div>
                    ${image?.detail ? `<p class="detail">${esc(image.detail)}</p>` : ''}
                    ${caseDescription(c)}
                    ${
                        image
                            ? `<div class="crops">${pictures(image, crop)}</div>`
                            : '<p class="detail">Nothing to compare (no area).</p>'
                    }
                </div>`
            }

            function renderGroup(g) {
                if (!g) {
                    $('main').innerHTML = '<p class="empty">Select a group.</p>'
                    return
                }
                const w = g.whole
                let layout
                if (w) {
                    const images =
                        $('mode').value === 'slider' &&
                        w.state === 'differs' &&
                        w.current
                            ? `<figure class="slider"><figcaption>Committed ← → ${w.approved ? 'not committed' : 'this run'}</figcaption><div class="frame"><img src="${committedFile(w.reference)}" onload="overlay(this)"/><div class="top" id="top"><img src="${file(w.current)}"/></div><svg data-areas preserveAspectRatio="none"></svg></div><input type="range" min="0" max="100" value="50" id="split"/></figure>`
                            : pictures(w, frame)
                    const cases = g.cases
                        .map(
                            (
                                c,
                                i,
                            ) => `<div class="case" data-case="${esc(c.id)}">
                            <div class="head"><span class="n">${i + 1}</span><span class="id">${esc(c.id)}</span>${status(c)}</div>
                            ${caseDescription(c)}
                        </div>`,
                        )
                        .join('')
                    layout = `<div class="layout">
                        <div class="images">${images}</div>
                        <div class="cases">${cases || '<p class="detail">No cases reported.</p>'}</div>
                    </div>`
                } else {
                    // By case: the whole screenshot for context (if the run
                    // has it), each case compared on its own.
                    const cases =
                        g.cases
                            .map((c, i) => caseRow(c, i, g.approvable))
                            .join('') ||
                        '<p class="detail">No cases reported.</p>'
                    layout = g.shot
                        ? `<div class="layout by-case">
                        <div class="images">${frame(file(g.shot), 'This run')}</div>
                        <div class="cases">${cases}</div>
                    </div>`
                        : `<div class="cases">${cases}</div>`
                }
                $('main').innerHTML = `
                    <div class="title state-${g.state}">
                        <h2>${esc(g.key)} / ${esc(g.name)}</h2>
                        ${badge(g.state)}${w ? change(w) : ''}
                        ${g.approvable && images(g).some(pending) ? `<button class="primary" id="approve">${w ? 'Approve' : 'Approve all'} (a)</button>` : ''}
                        ${images(g).some((image) => image.approved) ? `<button id="undo">${w ? 'Undo' : 'Undo all'} (u)</button>` : ''}
                    </div>
                    ${g.failures.map((f) => `<p class="detail">${esc(f)}</p>`).join('')}
                    ${g.detail ? `<p class="detail">${esc(g.detail)}</p>` : ''}
                    <div class="description">${descriptionHtml(g.description)}</div>
                    ${layout}
                    ${g.samples.length ? `<h3>Video samples</h3><div class="samples">${g.samples.map((s) => `<video src="${file(s)}" controls muted loop></video>`).join('')}</div>` : ''}
                `
                $('approve')?.addEventListener('click', () =>
                    send('approve', [g]),
                )
                $('undo')?.addEventListener('click', () => send('undo', [g]))
                document
                    .querySelectorAll('[data-approve]')
                    .forEach((el) =>
                        el.addEventListener('click', () =>
                            send('approve', [g], el.dataset.approve),
                        ),
                    )
                document
                    .querySelectorAll('[data-undo]')
                    .forEach((el) =>
                        el.addEventListener('click', () =>
                            send('undo', [g], el.dataset.undo),
                        ),
                    )
                drawDiffs()
                const split = $('split')
                if (split) {
                    const set = () =>
                        ($('top').style.clipPath =
                            `inset(0 0 0 ${split.value}%)`)
                    split.addEventListener('input', set)
                    set()
                }
                document.querySelectorAll('.case').forEach((el) => {
                    el.addEventListener('mouseenter', () => {
                        hovered = el.dataset.case
                        drawAreas()
                    })
                    el.addEventListener('mouseleave', () => {
                        hovered = undefined
                        drawAreas()
                    })
                })
            }

            // Approves the groups' images from the run (copies them into
            // screenshots/), or one case's (id), or undoes approvals that
            // aren't committed (action: approve or undo). Says why the
            // server refused, if it did.
            async function send(action, groups, id) {
                const errors = []
                for (const g of groups) {
                    const response = await fetch(`/api/${action}`, {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ key: g.key, name: g.name, id }),
                    })
                    if (!response.ok)
                        errors.push(`${g.name}: ${await response.text()}`)
                }
                $('error').textContent = errors.length
                    ? `Not done: ${errors.join('; ')}`
                    : ''
                await refresh()
            }

            function move(step) {
                const groups = shownGroups()
                const i = groups.findIndex((g) => groupId(g) === selected)
                const next =
                    groups[Math.min(groups.length - 1, Math.max(0, i + step))]
                if (next) {
                    selected = groupId(next)
                    render()
                    document
                        .querySelector('nav a.selected')
                        ?.scrollIntoView({ block: 'nearest' })
                }
            }

            $('nav').addEventListener('click', (e) => {
                const a = e.target.closest('a[data-id]')
                if (!a) return
                e.preventDefault()
                selected = a.dataset.id
                render()
            })
            $('filter').addEventListener('change', render)
            $('mode').addEventListener('change', render)
            // The groups with images from the run to approve.
            const toApprove = () =>
                data.entries
                    .flatMap((e) => e.groups)
                    .filter((g) => g.approvable && images(g).some(pending))
            $('approve-all').addEventListener('click', () => {
                const groups = toApprove()
                const count = groups.flatMap(images).filter(pending).length
                if (
                    confirm(
                        `Copy ${count} images (${groups.length} groups) over their references in screenshots/?`,
                    )
                )
                    send('approve', groups)
            })
            document.addEventListener('keydown', (e) => {
                if (e.target.closest('input, select')) return
                // Not the browser's own shortcuts (Cmd+A selects all).
                if (e.metaKey || e.ctrlKey || e.altKey) return
                if (e.key === 'j' || e.key === 'ArrowDown') move(1)
                else if (e.key === 'k' || e.key === 'ArrowUp') move(-1)
                else if (e.key === 'a') $('approve')?.click()
                else if (e.key === 'u') $('undo')?.click()
                else return
                e.preventDefault()
            })
            refresh()
        </script>
    </body>
</html>
