<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Regression screenshots</title>
        <style>
            :root {
                --bg: #fff;
                --fg: #1d1d1f;
                --muted: #6e6e73;
                --line: #e2e2e6;
                --panel: #f6f6f8;
                --accent: #0a66d8;
                --failed: #c4291c;
                --new: #8a4fd6;
                --differs: #d97a00;
                --approved: #1f8a4c;
                --ok: #9a9aa0;
                --area: rgba(10, 102, 216, 0.9);
                color-scheme: light dark;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #161618;
                    --fg: #ececf0;
                    --muted: #9a9aa3;
                    --line: #2c2c31;
                    --panel: #1f1f23;
                    --accent: #5aa2ff;
                    --area: rgba(90, 162, 255, 0.95);
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                font:
                    14px/1.45 -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                display: grid;
                grid-template-columns: 260px 1fr;
                grid-template-rows: auto 1fr;
                height: 100vh;
            }
            header {
                grid-column: 1 / -1;
                display: flex;
                gap: 12px;
                align-items: center;
                padding: 10px 16px;
                border-bottom: 1px solid var(--line);
            }
            header h1 {
                font-size: 15px;
                margin: 0;
            }
            header .run {
                color: var(--muted);
                font-family: ui-monospace, monospace;
                font-size: 12px;
            }
            header .spacer {
                flex: 1;
            }
            button,
            select {
                font: inherit;
                padding: 4px 10px;
                border-radius: 6px;
                border: 1px solid var(--line);
                background: var(--panel);
                color: var(--fg);
                cursor: pointer;
            }
            button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            button:disabled {
                opacity: 0.5;
                cursor: default;
            }
            nav {
                overflow: auto;
                border-right: 1px solid var(--line);
                padding: 8px 0;
            }
            nav h2 {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--muted);
                margin: 12px 16px 4px;
            }
            nav a {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 3px 16px;
                color: inherit;
                text-decoration: none;
                font-family: ui-monospace, monospace;
                font-size: 12.5px;
            }
            nav a.selected {
                background: var(--panel);
                font-weight: 600;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                flex: none;
            }
            .state-failed {
                --state: var(--failed);
            }
            .state-new {
                --state: var(--new);
            }
            .state-differs {
                --state: var(--differs);
            }
            .state-approved {
                --state: var(--approved);
            }
            .state-ok {
                --state: var(--ok);
            }
            .dot,
            .badge {
                background: var(--state);
            }
            .badge {
                color: #fff;
                border-radius: 4px;
                padding: 1px 6px;
                font-size: 12px;
                font-weight: 600;
            }
            main {
                overflow: auto;
                padding: 16px 20px 40px;
            }
            .title {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .title h2 {
                margin: 0;
                font-size: 18px;
                font-family: ui-monospace, monospace;
            }
            .detail {
                color: var(--muted);
                margin: 4px 0 0;
                font-size: 13px;
            }
            .description {
                margin: 12px 0;
                max-width: 900px;
            }
            .description p {
                margin: 4px 0;
            }
            .description b {
                display: inline-block;
                min-width: 54px;
                color: var(--muted);
                font-weight: 600;
            }
            .layout {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 380px;
                gap: 20px;
                align-items: start;
            }
            .images {
                display: grid;
                grid-auto-flow: column;
                grid-auto-columns: minmax(0, 1fr);
                gap: 12px;
            }
            figure {
                margin: 0;
            }
            figcaption {
                font-size: 12px;
                color: var(--muted);
                margin-bottom: 4px;
            }
            /* The screenshots fit their column and the window's height; the
            overlays are placed over the image's box (see place). */
            .frame {
                position: relative;
            }
            .frame > img {
                display: block;
                max-width: 100%;
                max-height: calc(100vh - 120px);
                border: 1px solid var(--line);
            }
            .frame svg,
            .slider .top {
                position: absolute;
                pointer-events: none;
            }
            .slider .top {
                overflow: hidden;
            }
            .slider .top img {
                display: block;
                width: 100%;
                height: 100%;
            }
            .frame .missing {
                height: 240px;
                display: grid;
                place-items: center;
                color: var(--muted);
                font-size: 13px;
                border: 1px dashed var(--line);
            }
            .slider input {
                width: 100%;
                margin-top: 6px;
            }
            .cases {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .case {
                padding: 8px 10px;
                border-radius: 8px;
                border: 1px solid transparent;
            }
            .case:hover,
            .case.hovered {
                border-color: var(--line);
                background: var(--panel);
            }
            .case .head {
                display: flex;
                gap: 8px;
                align-items: baseline;
            }
            .case .n {
                font-size: 11px;
                font-weight: 700;
                color: #fff;
                background: var(--area);
                border-radius: 4px;
                padding: 0 5px;
            }
            .case .id {
                font-family: ui-monospace, monospace;
                font-weight: 600;
            }
            .case .status {
                color: var(--failed);
                font-size: 13px;
            }
            .case p {
                margin: 3px 0 0;
            }
            .case .label {
                color: var(--muted);
                font-weight: 600;
            }
            .samples {
                margin-top: 16px;
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
            }
            .samples video {
                height: 360px;
                border: 1px solid var(--line);
            }
            .empty {
                color: var(--muted);
                padding: 40px;
            }
            kbd {
                font:
                    11px ui-monospace,
                    monospace;
                border: 1px solid var(--line);
                border-radius: 4px;
                padding: 0 4px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Regression screenshots</h1>
            <span class="run" id="run"></span>
            <span class="spacer"></span>
            <select id="filter">
                <option value="review">To review</option>
                <option value="all">All groups</option>
            </select>
            <select id="mode">
                <option value="side">Side by side</option>
                <option value="slider">Slider</option>
            </select>
            <button id="approve-all">Approve all to review</button>
            <span class="detail"
                ><kbd>j</kbd>/<kbd>k</kbd> next/previous,
                <kbd>a</kbd> approve</span
            >
        </header>
        <nav id="nav"></nav>
        <main id="main"><p class="empty">Loading…</p></main>
        <script>
            const STATES = {
                failed: 'failed',
                new: 'new',
                differs: 'differs',
                approved: 'approved',
                ok: 'ok',
            }
            const TO_REVIEW = ['failed', 'new', 'differs']
            let data = { entries: [] }
            let selected
            let hovered
            const $ = (id) => document.getElementById(id)
            // Changes with each load, so an approved reference isn't the
            // browser's cached image.
            let version = 0
            const file = (p) =>
                `/file?path=${encodeURIComponent(p)}&v=${version}`
            const esc = (s) =>
                String(s ?? '').replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            '&': '&amp;',
                            '<': '&lt;',
                            '>': '&gt;',
                            '"': '&quot;',
                        })[c],
                )
            const groupId = (g) => `${g.key}/${g.name}`

            function shownGroups() {
                const all = data.entries.flatMap((e) => e.groups)
                return $('filter').value === 'all'
                    ? all
                    : all.filter(
                          (g) =>
                              TO_REVIEW.includes(g.state) ||
                              groupId(g) === selected,
                      )
            }

            async function refresh() {
                data = await (await fetch('/api/runs')).json()
                version++
                $('run').textContent = data.run
                const groups = shownGroups()
                if (!groups.some((g) => groupId(g) === selected))
                    selected = groups[0] && groupId(groups[0])
                render()
            }

            function render() {
                const groups = shownGroups()
                const review = data.entries
                    .flatMap((e) => e.groups)
                    .filter((g) => g.state === 'new' || g.state === 'differs')
                $('approve-all').disabled = review.length === 0
                $('approve-all').textContent =
                    `Approve all to review (${review.length})`
                $('nav').innerHTML = data.entries
                    .map((entry) => {
                        const items = entry.groups.filter((g) =>
                            groups.includes(g),
                        )
                        if (items.length === 0) return ''
                        return (
                            `<h2>${esc(entry.key)}</h2>` +
                            items
                                .map(
                                    (g) =>
                                        `<a href="#" data-id="${esc(groupId(g))}" class="state-${g.state}${groupId(g) === selected ? ' selected' : ''}" title="${g.state}"><span class="dot"></span>${esc(g.name)}</a>`,
                                )
                                .join('')
                        )
                    })
                    .join('')
                if (!groups.length) {
                    $('nav').innerHTML =
                        '<p class="empty">Nothing to review.</p>'
                }
                renderGroup(
                    data.entries
                        .flatMap((e) => e.groups)
                        .find((g) => groupId(g) === selected),
                )
            }

            function descriptionHtml(d) {
                if (!d) return '<p class="detail">No description.</p>'
                return (
                    `<p><b>Checks</b> ${esc(d.checks)}</p>` +
                    (d.steps ? `<p><b>Steps</b> ${esc(d.steps)}</p>` : '') +
                    `<p><b>Shows</b> ${esc(d.shows)}</p>`
                )
            }

            // An image with the cases' areas drawn over it.
            function frame(src, group, label) {
                if (!src)
                    return `<figure><figcaption>${label}</figcaption><div class="frame"><div class="missing">none</div></div></figure>`
                return `<figure><figcaption>${label}</figcaption><div class="frame"><img src="${file(src)}" onload="overlay(this)" />${areas(group)}</div></figure>`
            }

            function areas(group) {
                return `<svg data-areas preserveAspectRatio="none"></svg>`
            }

            // Draws the case areas once the image's size is known.
            function overlay(img) {
                const svg = img.parentElement.querySelector('svg[data-areas]')
                if (!svg) return
                svg.setAttribute(
                    'viewBox',
                    `0 0 ${img.naturalWidth} ${img.naturalHeight}`,
                )
                place(img)
                drawAreas()
            }

            // Puts a frame's overlays (the areas, the slider's top image)
            // over its image's box.
            function place(img) {
                const box = {
                    left: `${img.offsetLeft}px`,
                    top: `${img.offsetTop}px`,
                    width: `${img.offsetWidth}px`,
                    height: `${img.offsetHeight}px`,
                }
                img.parentElement
                    .querySelectorAll(':scope > svg, :scope > .top')
                    .forEach((el) => Object.assign(el.style, box))
            }
            window.addEventListener('resize', () =>
                document.querySelectorAll('.frame > img').forEach(place),
            )

            function drawAreas() {
                const group = current()
                if (!group) return
                document.querySelectorAll('svg[data-areas]').forEach((svg) => {
                    svg.innerHTML = group.cases
                        .map((c, i) => {
                            const a = c.area
                            if (!a) return ''
                            const on = hovered === c.id
                            return `<rect x="${a.x}" y="${a.y}" width="${a.width}" height="${a.height}" fill="${on ? 'rgba(10,102,216,0.12)' : 'none'}" stroke="var(--area)" stroke-width="${on ? 6 : 2}" stroke-dasharray="${on ? '' : '10 8'}" rx="8"/><text x="${a.x + 10}" y="${a.y + 34}" font-size="30" font-weight="700" fill="var(--area)">${i + 1}</text>`
                        })
                        .join('')
                })
            }

            const current = () =>
                data.entries
                    .flatMap((e) => e.groups)
                    .find((g) => groupId(g) === selected)

            function renderGroup(g) {
                if (!g) {
                    $('main').innerHTML = '<p class="empty">Select a group.</p>'
                    return
                }
                const canApprove = g.shot && g.state !== 'failed'
                const images =
                    $('mode').value === 'slider' && g.reference && g.shot
                        ? `<figure class="slider"><figcaption>Reference ← → this run</figcaption><div class="frame"><img src="${file(g.reference)}" onload="overlay(this)"/><div class="top" id="top"><img src="${file(g.shot)}"/></div><svg data-areas preserveAspectRatio="none"></svg></div><input type="range" min="0" max="100" value="50" id="split"/></figure>`
                        : frame(g.reference, g, 'Reference') +
                          frame(g.shot, g, 'This run') +
                          (g.diff ? frame(g.diff, g, 'Diff') : '')
                const cases = g.cases
                    .map(
                        (c, i) => `<div class="case" data-case="${esc(c.id)}">
                            <div class="head"><span class="n">${i + 1}</span><span class="id">${esc(c.id)}</span>${c.status === 'OK' ? '' : `<span class="status">${esc(c.status)}</span>`}</div>
                            ${
                                c.description
                                    ? `<p>${esc(c.description.checks)}</p>` +
                                      (c.description.steps
                                          ? `<p><span class="label">Steps:</span> ${esc(c.description.steps)}</p>`
                                          : '') +
                                      `<p><span class="label">Shows:</span> ${esc(c.description.shows)}</p>`
                                    : ''
                            }
                        </div>`,
                    )
                    .join('')
                $('main').innerHTML = `
                    <div class="title state-${g.state}">
                        <h2>${esc(g.key)} / ${esc(g.name)}</h2>
                        <span class="badge">${g.state}</span>
                        ${canApprove && g.state !== 'ok' && g.state !== 'approved' ? '<button class="primary" id="approve">Approve (a)</button>' : ''}
                    </div>
                    ${g.detail ? `<p class="detail">${esc(g.detail)}</p>` : ''}
                    <div class="description">${descriptionHtml(g.description)}</div>
                    <div class="layout">
                        <div class="images">${images}</div>
                        <div class="cases">${cases || '<p class="detail">No cases reported.</p>'}</div>
                    </div>
                    ${g.samples.length ? `<h3>Video samples</h3><div class="samples">${g.samples.map((s) => `<video src="${file(s)}" controls muted loop></video>`).join('')}</div>` : ''}
                `
                $('approve')?.addEventListener('click', () => approve([g]))
                const split = $('split')
                if (split) {
                    const set = () =>
                        ($('top').style.clipPath =
                            `inset(0 0 0 ${split.value}%)`)
                    split.addEventListener('input', set)
                    set()
                }
                document.querySelectorAll('.case').forEach((el) => {
                    el.addEventListener('mouseenter', () => {
                        hovered = el.dataset.case
                        drawAreas()
                    })
                    el.addEventListener('mouseleave', () => {
                        hovered = undefined
                        drawAreas()
                    })
                })
            }

            async function approve(groups) {
                for (const g of groups) {
                    await fetch('/api/approve', {
                        method: 'POST',
                        body: JSON.stringify({ key: g.key, name: g.name }),
                    })
                }
                await refresh()
            }

            function move(step) {
                const groups = shownGroups()
                const i = groups.findIndex((g) => groupId(g) === selected)
                const next =
                    groups[Math.min(groups.length - 1, Math.max(0, i + step))]
                if (next) {
                    selected = groupId(next)
                    render()
                    document
                        .querySelector('nav a.selected')
                        ?.scrollIntoView({ block: 'nearest' })
                }
            }

            $('nav').addEventListener('click', (e) => {
                const a = e.target.closest('a[data-id]')
                if (!a) return
                e.preventDefault()
                selected = a.dataset.id
                render()
            })
            $('filter').addEventListener('change', render)
            $('mode').addEventListener('change', render)
            $('approve-all').addEventListener('click', () => {
                const groups = data.entries
                    .flatMap((e) => e.groups)
                    .filter((g) => g.state === 'new' || g.state === 'differs')
                if (
                    confirm(
                        `Copy ${groups.length} screenshots over their references?`,
                    )
                )
                    approve(groups)
            })
            document.addEventListener('keydown', (e) => {
                if (e.target.closest('input, select')) return
                if (e.key === 'j' || e.key === 'ArrowDown') move(1)
                else if (e.key === 'k' || e.key === 'ArrowUp') move(-1)
                else if (e.key === 'a') $('approve')?.click()
                else return
                e.preventDefault()
            })
            refresh()
        </script>
    </body>
</html>
